name: Dependency Dashboard

# Regenerates the org-wide dependency-update stats issue in this repo.
# Reads merged, risk-labeled Renovate PRs via the ct-agent-skills app token.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the dashboard to the run log instead of writing the issue"
        type: boolean
        default: false

concurrency:
  group: dependency-dashboard
  cancel-in-progress: false

permissions:
  contents: read # default token: checkout only; the app token does the real work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint scoped app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CT_AGENT_SKILLS_APP_ID }}
          private-key: ${{ secrets.CT_AGENT_SKILLS_PRIVATE_KEY }}
          owner: commercetools # token spans all repos where the app is installed
          permission-issues: write # upsert the dashboard issue in this repo
          permission-pull-requests: read # search merged PRs across the org
          permission-metadata: read # required for the search API

      - name: Generate dashboard
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependency-dashboard.js`)
            await run({ github, context, core })
